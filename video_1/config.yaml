# Arithmetic intensity calculator — accelerator & precision config
# Peak compute is dense (no sparsity). Ridge point = peak / bandwidth (FLOP/byte).
# peak_bf16_tflops is the baseline; the actual peak used in-app is
# peak_bf16_tflops * precisions[i].compute_multiplier for the selected dtype.
#
# Verified 2026-07-25 against vendor datasheets (dense/no-sparsity figures):
#   H100 SXM : 989 TFLOPS BF16, 1979 TFLOPS FP8, 3.35 TB/s     — official NVIDIA H100
#              datasheet PDF, fetched and cross-checked directly (BF16 1,979 TFLOPS*
#              and FP8 3,958 TFLOPS* are the *with-sparsity* column; datasheet states
#              "Specifications 1/2 lower without sparsity" -> 989 / 1979 dense). Also
#              confirms TF32 (fp32-equivalent) dense = 494.5 TFLOPS = exactly 0.5x BF16.
#   H200 SXM : same GH100 die/compute as H100 (989 BF16), 4.8 TB/s — NVIDIA H200 product page
#   A100 80GB: 312 TFLOPS BF16, 624 TOPS INT8, 2.039 TB/s      — NVIDIA A100 80GB datasheet
#   B200     : 2250 TFLOPS BF16, 4500 TFLOPS FP8, ~8 TB/s      — NVIDIA Blackwell B200 datasheet
#              (bandwidth reported as 7.7-8 TB/s across sources depending on 180GB/192GB SKU)
#   TPU v5e  : 197 TFLOPS BF16, 393 TOPS INT8, 0.819 TB/s      — Google Cloud TPU v5e docs
#   TPU v6e  : 918 TFLOPS BF16, 1836 TOPS INT8, 1.64 TB/s      — Google Cloud TPU v6e (Trillium) docs
# fp8/int8 = ~2x bf16 dense peak holds exactly across every chip above.
# fp32 compute_multiplier of 0.5x is directly confirmed on H100 (TF32 dense is exactly
# half of BF16 dense per the official datasheet); used here as a general approximation
# across all chips since per-chip fp32 tensor figures aren't all published — override
# if you have exact vendor numbers for a given chip.

accelerators:
  - name: "H100 SXM"
    peak_bf16_tflops: 989
    bandwidth_tbs: 3.35
  - name: "H200 SXM"
    peak_bf16_tflops: 989
    bandwidth_tbs: 4.8
  - name: "A100 80GB"
    peak_bf16_tflops: 312
    bandwidth_tbs: 2.039
  - name: "B200"
    peak_bf16_tflops: 2250
    bandwidth_tbs: 8.0
  - name: "TPU v5e"
    peak_bf16_tflops: 197
    bandwidth_tbs: 0.819
  - name: "TPU v6e"
    peak_bf16_tflops: 918
    bandwidth_tbs: 1.64

precisions:
  - name: "fp32"
    bytes: 4
    label: "fp32 — s = 4 B"
    compute_multiplier: 0.5
  - name: "bf16 / fp16"
    bytes: 2
    label: "bf16 / fp16 — s = 2 B"
    compute_multiplier: 1.0
  - name: "fp8 (e4m3 / e5m2)"
    bytes: 1
    label: "fp8 (e4m3 / e5m2) — s = 1 B"
    compute_multiplier: 2.0
  - name: "int8"
    bytes: 1
    label: "int8 — s = 1 B"
    compute_multiplier: 2.0

defaults:
  B: 5
  D: 4096
  F: 14336
  D_dot: 4096
  dtype_index: 1        # bf16 / fp16
  accelerator_index: 0  # H100 SXM — bf16

matmul_shape:
  b_slider_min: 5
  b_slider_max: 16384
  b_slider_step: 5
  d_slider_min: 32
  d_slider_max: 32768
  d_slider_step: 32
  f_slider_min: 128
  f_slider_max: 65536
  f_slider_step: 128
  b_max: 16384

dot_product_shape:
  d_slider_min: 128
  d_slider_max: 1048576
  d_slider_step: 128
