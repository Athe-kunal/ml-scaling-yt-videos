[project]
name = "whisper-manim"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "manim-slides[pyqt6]>=5.7.0",
    "manimgl>=1.7.2",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "setuptools<81",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
